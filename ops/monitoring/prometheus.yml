global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s


scrape_configs:

  # ============================================================
  # Gastro API metrics
  # ============================================================

  - job_name: gastro-api

    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - api:8080


  # ============================================================
  # Host metrics
  # ============================================================

  - job_name: node

    static_configs:
      - targets:
          - node-exporter:9100


  # ============================================================
  # Docker/container metrics
  # ============================================================

  - job_name: cadvisor

    static_configs:
      - targets:
          - cadvisor:8080