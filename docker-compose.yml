services:
  postgres:
    image: postgres:16-alpine
    container_name: gastro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gastro_menu}
    volumes:
      - ${POSTGRES_DATA_DIR:-/srv/gastro/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [gastro-network]
    security_opt:
      - no-new-privileges:true

  api:
    image: ${IMAGE_NAME:-ghcr.io/radixartem/gastromenuparserapi}:${VERSION:-latest}
    container_name: gastro-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING is required}
      ApplyMigrations: ${APPLY_MIGRATIONS:-true}
      ImportApiKey: ${IMPORT_API_KEY:?IMPORT_API_KEY is required}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [gastro-network]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: gastro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [gastro-network]
    security_opt:
      - no-new-privileges:true

networks:
  gastro-network:
    name: gastro-network
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
