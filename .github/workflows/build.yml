name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'global.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'global.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gastromenuparserapi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/GastroLeinefeldeAPI.Tests/GastroLeinefeldeAPI.Tests.csproj
      - name: Build
        run: dotnet build src/GastroLeinefeldeAPI.Tests/GastroLeinefeldeAPI.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test src/GastroLeinefeldeAPI.Tests/GastroLeinefeldeAPI.Tests.csproj --configuration Release --no-build --logger trx

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/GastroLeinefeldeAPI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
