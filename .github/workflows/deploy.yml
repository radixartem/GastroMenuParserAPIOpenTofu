name: Deploy Production

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "GHCR image tag (commit SHA or latest)"
        required: true
        default: "latest"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    environment: production

    env:
      SERVER_HOST: ${{ secrets.PROD_SERVER_IP }}
      DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_sha }}
      IMAGE_NAME: ghcr.io/radixartem/gastro-menu-parser-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload runtime files
        run: |
          set -Eeuo pipefail

          tar czf /tmp/gastro-deploy.tgz \
            docker-compose.yml \
            docker-compose.monitoring.yml \
            caddy \
            ops/monitoring \
            ops/backups

          scp \
            /tmp/gastro-deploy.tgz \
            "$DEPLOY_USER@$SERVER_HOST:/tmp/gastro-deploy.tgz"

      - name: Create production environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.PROD_GRAFANA_PASSWORD }}
          IMPORT_API_KEY: ${{ secrets.PROD_IMPORT_API_KEY }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          set -Eeuo pipefail

          umask 077

          cat > /tmp/gastro.env <<EOF
          IMAGE_NAME=$IMAGE_NAME
          VERSION=$VERSION

          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=gastro_menu

          ASPNETCORE_ENVIRONMENT=Production
          APPLY_MIGRATIONS=true

          IMPORT_API_KEY=$IMPORT_API_KEY

          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=$GRAFANA_PASSWORD

          ACME_EMAIL=$ACME_EMAIL
          EOF

          scp \
            /tmp/gastro.env \
            "$DEPLOY_USER@$SERVER_HOST:/tmp/gastro.env"

      - name: Install runtime files
        run: |
          set -Eeuo pipefail

          ssh "$DEPLOY_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          sudo install -d -m 0755 /opt/gastro-api
          sudo install -d -m 0755 /etc/gastro-api

          sudo tar xzf /tmp/gastro-deploy.tgz -C /opt/gastro-api

          sudo install \
            -m 0600 \
            /tmp/gastro.env \
            /opt/gastro-api/.env

          sudo chown -R "$USER:$USER" /opt/gastro-api

          rm -f \
            /tmp/gastro-deploy.tgz \
            /tmp/gastro.env
          REMOTE

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            ssh "$DEPLOY_USER@$SERVER_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy production
        run: |
          set -Eeuo pipefail

          ssh "$DEPLOY_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/gastro-api

          if ! docker network inspect gastro-network >/dev/null 2>&1; then
            docker network create \
              --driver bridge \
              gastro-network
          fi

          echo "Validating application configuration..."

          docker compose \
            --env-file .env \
            -p gastro-api \
            config >/dev/null

          echo "Pulling application images..."

          docker compose \
            --env-file .env \
            -p gastro-api \
            pull

          echo "Deploying application..."

          docker compose \
            --env-file .env \
            -p gastro-api \
            up -d \
            --force-recreate \
            --remove-orphans

          if [ -f docker-compose.monitoring.yml ]; then

            echo "Validating monitoring configuration..."

            docker compose \
              --env-file .env \
              -p gastro-monitoring \
              -f docker-compose.monitoring.yml \
              config >/dev/null

            echo "Pulling monitoring images..."

            docker compose \
              --env-file .env \
              -p gastro-monitoring \
              -f docker-compose.monitoring.yml \
              pull

            echo "Deploying monitoring..."

            docker compose \
              --env-file .env \
              -p gastro-monitoring \
              -f docker-compose.monitoring.yml \
              up -d \
              --remove-orphans
          fi

          echo "Application containers:"

          docker compose \
            --env-file .env \
            -p gastro-api \
            ps

          echo "Monitoring containers:"

          docker compose \
            --env-file .env \
            -p gastro-monitoring \
            -f docker-compose.monitoring.yml \
            ps
          REMOTE

      - name: Verify deployment
        run: |
          set -Eeuo pipefail

          ssh "$DEPLOY_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/gastro-api

          API_CONTAINER="$(docker compose \
            --env-file .env \
            -p gastro-api \
            ps -q api)"

          if [ -z "$API_CONTAINER" ]; then
            echo "ERROR: API container was not found"
            exit 1
          fi

          API_STATUS="$(docker inspect \
            --format '{{.State.Status}}' \
            "$API_CONTAINER")"

          API_HEALTH="$(docker inspect \
            --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
            "$API_CONTAINER")"

          echo "API status: $API_STATUS"
          echo "API health: $API_HEALTH"

          if [ "$API_STATUS" != "running" ]; then
            docker logs --tail 100 "$API_CONTAINER" || true
            exit 1
          fi

          if [ "$API_HEALTH" != "healthy" ]; then
            echo "Waiting for API healthcheck..."
            sleep 15

            API_HEALTH="$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$API_CONTAINER")"

            if [ "$API_HEALTH" != "healthy" ]; then
              echo "ERROR: API is not healthy"
              docker logs --tail 100 "$API_CONTAINER" || true
              exit 1
            fi
          fi

          POSTGRES_CONTAINER="$(docker compose \
            --env-file .env \
            -p gastro-api \
            ps -q postgres)"

          POSTGRES_HEALTH="$(docker inspect \
            --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
            "$POSTGRES_CONTAINER")"

          echo "PostgreSQL health: $POSTGRES_HEALTH"

          if [ "$POSTGRES_HEALTH" != "healthy" ]; then
            echo "ERROR: PostgreSQL is not healthy"
            docker logs --tail 100 "$POSTGRES_CONTAINER" || true
            exit 1
          fi

          CADDY_CONTAINER="$(docker compose \
            --env-file .env \
            -p gastro-api \
            ps -q caddy)"

          CADDY_STATUS="$(docker inspect \
            --format '{{.State.Status}}' \
            "$CADDY_CONTAINER")"

          echo "Caddy status: $CADDY_STATUS"

          if [ "$CADDY_STATUS" != "running" ]; then
            echo "ERROR: Caddy is not running"
            docker logs --tail 100 "$CADDY_CONTAINER" || true
            exit 1
          fi

          echo "Deployment verification successful."
          REMOTE