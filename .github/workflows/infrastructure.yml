name: Infrastructure Plan

on:
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opentofu-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/live/production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.1'

      - name: Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OBJ_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OBJ_SECRET_KEY }}
        run: tofu init -backend-config="endpoint=${{ secrets.OBJ_ENDPOINT }}"

      - name: Format Check
        run: tofu fmt -check -recursive

      - name: Validate
        run: tofu validate

      - name: Plan
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_key_ids: ${{ secrets.SSH_KEY_IDS }}
          TF_VAR_servers: ${{ secrets.SERVERS_CONFIG }} 
        run: tofu plan